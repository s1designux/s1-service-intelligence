<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클라우드영상시스템 — PC 웹뷰어 기획 자료</title>
  <style>
/* ── Reset / 레이아웃 — standalone 단일 페이지 오버라이드 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-width: 220px;
  --header-h: 56px;
  --blue-500: #3b82f6;
  --blue-600: #2563eb;
  --blue-700: #1d4ed8;
  --blue-50: #eff6ff;
  --green-500: #22c55e;
  --green-600: #16a34a;
  --green-50: #f0fdf4;
  --yellow-500: #eab308;
  --yellow-50: #fefce8;
  --yellow-100: #fef9c3;
  --yellow-600: #ca8a04;
  --red-500: #ef4444;
  --red-600: #dc2626;
  --red-50: #fef2f2;
  --orange-500: #f97316;
  --orange-50: #fff7ed;
  --orange-100: #ffedd5;
  --orange-600: #ea580c;
  --purple-500: #a855f7;
  --purple-50: #faf5ff;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
  --sidebar-bg: #1e2433;
  --sidebar-hover: #2a3347;
  --sidebar-active: #2563eb;
  --text-sidebar: #c9d1e0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--gray-50);
  color: var(--gray-900);
  font-size: 14px;
  display: flex;
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
}

.sidebar-header {
  padding: 18px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.sidebar-title {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .02em;
  line-height: 1.2;
}

.sidebar-sub {
  font-size: 11px;
  color: var(--text-sidebar);
  margin-top: 3px;
  opacity: .7;
}

.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0 20px; }

/* ── Nav group ── */
.nav-group { padding: 0 0 6px; }
.nav-group + .nav-group {
  border-top: 1px solid rgba(255,255,255,.06);
  margin-top: 6px;
  padding-top: 10px;
}

.nav-group-label {
  font-size: 10px;
  font-weight: 600;
  color: rgba(201,209,224,.35);
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 2px 16px 5px;
}

/* ── Top-level nav items ── */
.nav-item {
  display: flex;
  align-items: center;
  padding: 7px 16px;
  color: rgba(201,209,224,.8);
  cursor: pointer;
  font-size: 13px;
  transition: background .15s, color .15s;
  border-left: 2px solid transparent;
}
.nav-item:hover { background: var(--sidebar-hover); color: #fff; }
.nav-item.active {
  background: rgba(37,99,235,.18);
  color: #fff;
  border-left-color: var(--blue-500);
  font-weight: 600;
}

/* ── Domain accordion toggles ── */
.nav-domain-toggle {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 16px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 700;
  color: rgba(201,209,224,.4);
  letter-spacing: .08em;
  text-transform: uppercase;
  transition: color .15s;
  margin-top: 6px;
  user-select: none;
  border-left: 2px solid transparent;
}
.nav-domain-toggle:hover { color: rgba(201,209,224,.7); }

.nav-domain-arrow {
  font-size: 7px;
  transition: transform .2s;
  flex-shrink: 0;
  opacity: .6;
}
.nav-domain-toggle.collapsed .nav-domain-arrow { transform: rotate(-90deg); }

.nav-domain-items { overflow: hidden; }
.nav-domain-items.collapsed { display: none; }

/* ── Service sub-items ── */
.nav-sub-item {
  display: flex;
  align-items: center;
  padding: 5px 16px 5px 26px;
  color: rgba(201,209,224,.65);
  cursor: pointer;
  font-size: 12px;
  transition: background .15s, color .15s;
  border-left: 2px solid transparent;
}
.nav-sub-item::before {
  content: '';
  display: block;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(201,209,224,.25);
  margin-right: 9px;
  flex-shrink: 0;
}
.nav-sub-item:hover { background: var(--sidebar-hover); color: rgba(201,209,224,.9); }
.nav-sub-item.active {
  background: rgba(37,99,235,.18);
  color: #fff;
  border-left-color: var(--blue-500);
  font-weight: 600;
}
.nav-sub-item.active::before { background: var(--blue-400); }

.nav-icon { display: none; }

/* ── Main ── */
.main {
  margin-left: var(--sidebar-width);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.main-header {
  height: var(--header-h);
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 50;
  gap: 12px;
}

.breadcrumb {
  font-size: 13px;
  color: var(--gray-500);
}

.breadcrumb strong { color: var(--gray-900); font-weight: 600; }

.header-actions { margin-left: auto; display: flex; gap: 8px; }

.btn {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: background .15s;
}

.btn-primary { background: var(--blue-600); color: #fff; }
.btn-primary:hover { background: var(--blue-700); }
.btn-ghost { background: transparent; color: var(--gray-600); border: 1px solid var(--gray-200); }
.btn-ghost:hover { background: var(--gray-100); }

.content { padding: 28px; flex: 1; }

.section { display: none; }
.section.active { display: block; }

/* ── Section header ── */
.section-header { margin-bottom: 24px; }
.section-title { font-size: 20px; font-weight: 700; color: var(--gray-900); }
.section-desc { font-size: 13px; color: var(--gray-500); margin-top: 4px; }

/* ── Cards ── */
.cards { display: grid; gap: 16px; }
.cards-4 { grid-template-columns: repeat(4, 1fr); }
.cards-3 { grid-template-columns: repeat(3, 1fr); }
.cards-2 { grid-template-columns: repeat(2, 1fr); }

.card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  padding: 20px;
}

.card-label { font-size: 12px; color: var(--gray-500); font-weight: 500; margin-bottom: 8px; }
.card-value { font-size: 28px; font-weight: 700; color: var(--gray-900); }
.card-sub { font-size: 12px; color: var(--gray-400); margin-top: 4px; }

/* ── Service card ── */
.service-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.service-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.service-card-name { font-size: 16px; font-weight: 700; }
.service-card-system { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

.service-card-meta { display: flex; flex-direction: column; gap: 6px; }
.meta-row { display: flex; gap: 6px; font-size: 12px; }
.meta-label { color: var(--gray-400); width: 80px; flex-shrink: 0; }
.meta-value { color: var(--gray-700); font-weight: 500; }

.service-card-actions { margin-top: 4px; }

/* ── Badges ── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.badge-active { background: var(--green-50); color: var(--green-600); }
.badge-standby { background: var(--yellow-50); color: var(--yellow-600); }
.badge-planned { background: var(--gray-100); color: var(--gray-500); }
.badge-blocked { background: var(--red-50); color: var(--red-600); }
.badge-deprecated { background: var(--gray-100); color: var(--gray-400); }
.badge-pending { background: var(--orange-100); color: var(--orange-600); }
.badge-ok { background: var(--green-50); color: var(--green-600); }
.badge-unknown { background: var(--gray-100); color: var(--gray-500); }
.badge-fail { background: var(--red-50); color: var(--red-600); }
.badge-draft { background: var(--gray-100); color: var(--gray-500); }
.badge-high { background: var(--red-50); color: var(--red-600); }
.badge-medium { background: var(--yellow-100); color: var(--yellow-600); }
.badge-low { background: var(--gray-100); color: var(--gray-500); }

/* ── Table ── */
.table-wrap {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  overflow: hidden;
}

.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--gray-100);
}

.table-title { font-size: 14px; font-weight: 600; }
.table-count { font-size: 12px; color: var(--gray-400); }

table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: .05em;
  padding: 10px 20px;
  background: var(--gray-50);
  border-bottom: 1px solid var(--gray-200);
}
td { padding: 12px 20px; border-bottom: 1px solid var(--gray-100); font-size: 13px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--gray-50); }

/* ── Service Intelligence List ── */
.si-block {
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 12px;
}

.si-block-active { border-color: #bfdbfe; }
.si-block-planned { border-color: var(--gray-200); }

.si-domain-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 20px;
  border-bottom: 1px solid var(--gray-200);
}

.si-block-active .si-domain-header   { background: #eff6ff; border-bottom-color: #bfdbfe; }
.si-block-planned .si-domain-header  { background: var(--gray-50); }

.si-domain-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-800);
}

.si-domain-meta {
  font-size: 11px;
  color: var(--gray-400);
  flex: 1;
}

.si-rows { display: flex; flex-direction: column; background: #fff; }

.si-row {
  display: grid;
  grid-template-columns: 2fr 1.2fr 2.5fr auto;
  gap: 16px;
  align-items: center;
  padding: 11px 20px;
  border-bottom: 1px solid var(--gray-100);
}
.si-row:last-child { border-bottom: none; }

.si-row-active { background: #fff; }
.si-row-planned { background: var(--gray-50); }
.si-row-active:hover { background: #f0f6ff; }
.si-row-planned:hover { background: var(--gray-100); }

.si-svc-name {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-900);
}
.si-row-planned .si-svc-name { color: var(--gray-400); font-weight: 500; }

.si-svc-system {
  display: block;
  font-size: 11px;
  color: var(--gray-400);
  margin-top: 2px;
}
.si-row-planned .si-svc-system { color: var(--gray-300); }

.si-col-focus {
  font-size: 12px;
  color: var(--gray-300);
}
.si-row-active .si-col-focus {
  color: var(--blue-600);
  font-weight: 500;
}

.si-col-action {
  font-size: 12px;
  color: var(--gray-300);
}
.si-row-active .si-col-action {
  color: var(--gray-600);
}

.si-col-status { display: flex; justify-content: flex-end; }

/* ── Layer group ── */
.layer-group { margin-bottom: 20px; }
.layer-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-400);
  text-transform: uppercase;
  letter-spacing: .07em;
  padding: 6px 0;
  border-bottom: 1px solid var(--gray-200);
  margin-bottom: 8px;
}

/* ── Tabs ── */
.tabs { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 2px solid var(--gray-200); }
.tab {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--gray-500);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
}
.tab.active { color: var(--blue-600); border-bottom-color: var(--blue-600); font-weight: 600; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Filter bar ── */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
}

.filter-chip {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--gray-200);
  background: #fff;
  color: var(--gray-600);
  transition: all .15s;
}

.filter-chip.active { background: var(--blue-600); color: #fff; border-color: var(--blue-600); }

/* ── Review item ── */
.review-item {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 16px 20px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.review-content { flex: 1; }
.review-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.review-meta { font-size: 12px; color: var(--gray-500); display: flex; gap: 12px; flex-wrap: wrap; }

/* ── Registry list ── */
.registry-item {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--gray-100);
  gap: 12px;
  font-size: 12px;
}

.registry-item:last-child { border-bottom: none; }
.registry-path { font-family: monospace; color: var(--gray-700); flex: 1; word-break: break-all; }
.registry-role { color: var(--gray-400); width: 160px; flex-shrink: 0; }

/* ── Gate status ── */
.gate-row { display: flex; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--gray-100); gap: 12px; }
.gate-row:last-child { border-bottom: none; }
.gate-name { flex: 1; font-size: 13px; font-weight: 500; }
.gate-command { font-family: monospace; font-size: 11px; color: var(--gray-400); }
.gate-last { font-size: 12px; color: var(--gray-400); width: 100px; }

/* ── Next action banner ── */
.next-action {
  background: var(--blue-50);
  border: 1px solid var(--blue-500);
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}

.next-action-label { font-weight: 600; color: var(--blue-700); white-space: nowrap; }
.next-action-text { color: var(--gray-700); }

/* ── Overview: 현재 분석 중 블록 ── */
.ov-active-wrap {
  background: var(--blue-50);
  border: 1px solid #bfdbfe;
  border-radius: 10px;
  padding: 18px 20px;
}
.ov-active-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue-600);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.ov-active-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.ov-active-row + .ov-active-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid #dbeafe; }
.ov-active-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-900);
  white-space: nowrap;
}
.ov-active-focus {
  font-size: 13px;
  color: var(--blue-700);
  font-weight: 500;
}
.ov-active-action {
  font-size: 12px;
  color: var(--gray-500);
  margin-left: auto;
}

/* ── Responsive spacing ── */
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-16 { margin-bottom: 16px; }
.flex { display: flex; }
.gap-8 { gap: 8px; }
.items-center { align-items: center; }
.link { color: var(--blue-600); text-decoration: none; font-weight: 500; }
.link:hover { text-decoration: underline; }
.text-muted { color: var(--gray-400); }
.text-sm { font-size: 12px; }
.font-mono { font-family: monospace; }

/* ── Agent Architecture ── */
.agent-arch { display: flex; flex-direction: column; gap: 24px; }

.agent-group {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  overflow: hidden;
}

.agent-group-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  background: var(--gray-50);
  border-bottom: 1px solid var(--gray-200);
}

.agent-group-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-700);
  text-transform: uppercase;
  letter-spacing: .05em;
}

.agent-group-desc {
  font-size: 12px;
  color: var(--gray-400);
  margin-left: auto;
}

.agent-group-count {
  font-size: 11px;
  color: var(--gray-400);
  background: var(--gray-200);
  padding: 1px 7px;
  border-radius: 10px;
}

.agent-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  padding: 16px;
}

.agent-card {
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: #fff;
  transition: box-shadow .15s;
}

.agent-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }

.agent-card.status-active   { border-left: 3px solid var(--green-500); }
.agent-card.status-standby  { border-left: 3px solid var(--yellow-500); background: var(--gray-50); }
.agent-card.status-planned  { border-left: 3px solid var(--gray-300); }
.agent-card.status-blocked  { border-left: 3px solid var(--red-500); }
.agent-card.status-deprecated { border-left: 3px solid var(--gray-200); opacity: .6; }

.agent-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.agent-card-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-900);
  line-height: 1.3;
}

.agent-card-id {
  font-size: 10px;
  color: var(--gray-400);
  font-family: monospace;
  margin-top: 2px;
}

.agent-card-role {
  font-size: 12px;
  color: var(--gray-600);
  line-height: 1.5;
}

.agent-card-activation {
  font-size: 11px;
  color: var(--gray-400);
  background: var(--gray-50);
  border: 1px solid var(--gray-100);
  border-radius: 4px;
  padding: 5px 8px;
  line-height: 1.4;
}

.agent-card-activation-label {
  font-weight: 600;
  color: var(--gray-500);
  display: block;
  margin-bottom: 2px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.agent-card-meta {
  font-size: 11px;
  color: var(--gray-400);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.agent-card-notes {
  font-size: 11px;
  color: var(--blue-600);
  background: var(--blue-50);
  border-radius: 4px;
  padding: 4px 8px;
  line-height: 1.4;
}

/* ── Service Team block ── */
.service-team-block {
  border-top: 1px solid var(--gray-100);
}

.service-team-block:first-child { border-top: none; }

.service-team-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--gray-50);
}

.service-team-header.status-active { background: var(--green-50); }
.service-team-header.status-planned { background: var(--gray-50); }

.service-team-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-800);
}

.service-team-meta {
  font-size: 11px;
  color: var(--gray-500);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 2px;
}

.service-team-workspace {
  font-family: monospace;
  font-size: 11px;
  color: var(--gray-400);
  margin-left: auto;
}

/* ── Role distinction notice ── */
.role-notice {
  background: var(--yellow-50);
  border: 1px solid var(--yellow-500);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 12px;
  color: var(--gray-700);
  margin-bottom: 20px;
  line-height: 1.6;
}

.role-notice strong { color: var(--gray-900); }

/* ── Agent summary stats ── */
.agent-summary-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.agent-stat {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 10px 18px;
  text-align: center;
  min-width: 80px;
}

.agent-stat-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--gray-900);
}

.agent-stat-label {
  font-size: 11px;
  color: var(--gray-400);
  margin-top: 2px;
}

.agent-stat.highlight-active .agent-stat-value { color: var(--green-600); }
.agent-stat.highlight-standby .agent-stat-value { color: var(--yellow-600); }
.agent-stat.highlight-planned .agent-stat-value { color: var(--gray-400); }

/* ══════════════════════════════════════
   Agent Org Chart  (.agent-org-chart)
   ══════════════════════════════════════ */

.agent-org-chart {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  padding: 28px 32px 32px;
  margin-bottom: 24px;
}

/* ── Root title (그룹명 레이블) ── */
.org-root {
  padding: 0 0 20px;
}

.org-root h3 {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin: 0;
}

/* ── Vertical connector ── */
.org-connector {
  width: 2px;
  height: 16px;
  background: var(--gray-300);
  margin: 0 auto;
}

/* ── Tier Cards: Lead, Orchestrator ── */
.org-card {
  border: 2px solid var(--gray-200);
  border-radius: 10px;
  padding: 10px 14px;
  background: #fff;
  max-width: 373px;
  width: 100%;
  margin: 0 auto;
  position: relative;
}

/* standby → 회색: 비활성 상태를 명확히 표현 */
.org-lead         { border-color: var(--gray-300); background: var(--gray-100); }
/* active → 파란색: 현재 작동 중 */
.org-orchestrator { border-color: var(--blue-400); background: var(--blue-50); }

.org-card-header {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.org-card-header > div { flex: 1; }

.org-card-header .badge {
  position: absolute;
  top: 10px;
  right: 14px;
}

.org-card-header h3 {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-900);
  margin: 0;
}

.org-lead .org-card-header h3 { color: var(--gray-500); }

.org-node-role {
  font-size: 11px;
  color: var(--gray-400);
  margin: 3px 0 0;
}

.org-lead .org-node-role { color: var(--gray-400); }

/* ── Sections: Shared Capability / Service Domain ── */
.org-section {
  border: 1.5px solid var(--gray-200);
  border-radius: 10px;
  padding: 20px 24px;
}

.org-section.shared-capabilities       { border-color: var(--gray-200); }
.org-section.experience-consistency-review { border-color: var(--gray-200); border-style: dashed; opacity: .85; text-align: center; }
.org-section.service-domain-teams      { border-color: var(--gray-200); }

.exp-consistency-wrap {
  display: flex;
  justify-content: center;
}
.exp-consistency-card {
  border: 1px solid var(--gray-300);
  border-radius: 8px;
  padding: 12px 16px;
  background: var(--gray-100);
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: fit-content;
}

.org-section-header { margin-bottom: 14px; }

.org-section-header h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-900);
  margin: 0 0 3px;
}

.org-section-sub {
  font-size: 12px;
  color: var(--gray-500);
  margin: 0 0 4px;
}

.org-section-desc {
  font-size: 12px;
  color: var(--gray-400);
  line-height: 1.5;
  margin: 0;
}

/* ── Shared: 6 mini-agent cards ── */
.capability-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}

.mini-agent-card {
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 10px 12px;
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.mini-agent-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
}

/* 상태별 미니 카드 배경 */
.mini-agent-card.status-active  { background: #fff;              border-color: var(--gray-200); }
.mini-agent-card.status-standby { background: var(--gray-100);   border-color: var(--gray-300); }
.mini-agent-card.status-planned { background: var(--gray-50);    border-color: var(--gray-200); opacity: .7; }

.mini-agent-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-800);
  flex: 1;
  min-width: 0;
}

.mini-agent-card.status-standby .mini-agent-name,
.mini-agent-card.status-planned .mini-agent-name { color: var(--gray-500); }

.mini-agent-role {
  font-size: 10px;
  color: var(--gray-400);
  line-height: 1.4;
}

/* ── Service Domain: 5 service-team cards ── */
.service-team-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.service-team-card {
  border: 1.5px solid var(--gray-200);
  border-radius: 8px;
  padding: 12px;
  background: #fff;
}

.service-team-card.svc-active  { border-color: var(--green-500); background: var(--green-50); }
.service-team-card.svc-planned { border-color: var(--gray-200);  background: var(--gray-50);  opacity: .75; }

.stc-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 8px;
}

.stc-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-900);
  flex: 1;
  min-width: 0;
}

.stc-sub {
  font-size: 10px;
  color: var(--gray-400);
  margin: 0 0 6px;
}

.stc-section {
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid var(--gray-200);
}

.stc-section-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--gray-400);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.stc-manager-chip {
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--gray-500);
  background: var(--gray-100);
  border: 1px solid var(--gray-200);
  border-radius: 4px;
  padding: 2px 7px;
}
.stc-manager-chip.stc-manager-active {
  color: var(--green-600);
  background: var(--green-50);
  border-color: var(--green-500);
}

.stc-agents { display: flex; flex-direction: column; gap: 2px; }

.stc-agent-row {
  font-size: 10px;
  color: var(--gray-500);
  display: flex;
  align-items: center;
  gap: 4px;
  line-height: 1.4;
}

.stc-agent-row::before { content: '·'; color: var(--gray-300); flex-shrink: 0; }

/* ── Org Chart Legend ── */
/* ── 공유 자료 ── */
.sn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}

.sn-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 140px;
}

.sn-card-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--blue-600);
  background: var(--blue-50);
  border-radius: 4px;
  padding: 2px 7px;
  width: fit-content;
  letter-spacing: .04em;
}

.sn-card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-900);
  line-height: 1.4;
}

.sn-card-desc {
  font-size: 12px;
  color: var(--gray-500);
  line-height: 1.6;
  flex: 1;
}

.sn-card-date {
  font-size: 11px;
  color: var(--gray-400);
  margin-top: 4px;
}

.sn-card-clickable {
  cursor: pointer;
  transition: box-shadow .15s, transform .15s, border-color .15s;
}
.sn-card-clickable:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,.1);
  transform: translateY(-2px);
  border-color: var(--blue-500);
}

.sn-card-view-hint {
  font-size: 10px;
  color: var(--blue-500);
  font-weight: 600;
  margin-left: 8px;
  opacity: 0;
  transition: opacity .15s;
}
.sn-card-clickable:hover .sn-card-view-hint { opacity: 1; }

.sn-card-empty {
  border-style: dashed;
  background: var(--gray-50);
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 10px;
  cursor: default;
  opacity: .6;
}

/* ── 공유자료 이미지 모달 ── */
.sn-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.sn-modal-overlay.open { display: flex; }

.sn-modal-box {
  background: #fff;
  border-radius: 12px;
  max-width: 90vw;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.sn-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--gray-200);
  flex-shrink: 0;
}

.sn-modal-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-900);
}

.sn-modal-close {
  background: none;
  border: none;
  font-size: 16px;
  color: var(--gray-400);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: background .15s, color .15s;
  line-height: 1;
}
.sn-modal-close:hover { background: var(--gray-100); color: var(--gray-700); }

.sn-modal-body {
  overflow: auto;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sn-modal-img {
  max-width: 100%;
  max-height: calc(90vh - 100px);
  border-radius: 6px;
  display: block;
}

.sn-empty-icon {
  font-size: 24px;
  color: var(--gray-300);
  line-height: 1;
}

/* ════════════════════════════════════════
   에이전트 활동보고서 (ar-*)
   ════════════════════════════════════════ */

/* 진단 기준 안내 배너 */
.ar-disclaimer {
  font-size: 11px;
  color: var(--gray-500);
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  padding: 8px 14px;
  margin-bottom: 20px;
  line-height: 1.5;
}

/* 요약 카드 그리드 */
.ar-summary-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.ar-summary-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  padding: 16px 18px;
}
.ar-summary-card.ar-summary-high  { border-top: 3px solid var(--green-500); }
.ar-summary-card.ar-summary-medium { border-top: 3px solid var(--yellow-500); }
.ar-summary-card.ar-summary-low   { border-top: 3px solid var(--gray-300); }
.ar-summary-label { font-size: 11px; color: var(--gray-500); font-weight: 500; margin-bottom: 6px; }
.ar-summary-value { font-size: 28px; font-weight: 700; color: var(--gray-900); line-height: 1; }
.ar-summary-sub   { font-size: 11px; color: var(--gray-400); margin-top: 6px; }

/* 섹션 타이틀 */
.ar-section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-800);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--gray-200);
}

/* 프로젝트 카드 */
.ar-project-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.ar-project-card {
  background: #fff;
  border: 1.5px solid var(--gray-200);
  border-radius: 10px;
  padding: 14px 16px;
}
.ar-proj-active  { border-color: var(--green-500); }
.ar-proj-planned { opacity: .75; }

.ar-project-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.ar-project-name  { font-size: 12px; font-weight: 700; color: var(--gray-900); flex: 1; min-width: 0; }
.ar-project-phase { font-size: 11px; color: var(--gray-500); margin-bottom: 10px; }

.ar-progress-bar-wrap {
  height: 4px;
  background: var(--gray-100);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 6px;
}
.ar-progress-bar {
  height: 100%;
  background: var(--green-500);
  border-radius: 2px;
  transition: width .3s;
}
.ar-proj-planned .ar-progress-bar { background: var(--gray-300); }

.ar-project-meta {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--gray-400);
}
.ar-progress-pct { font-weight: 600; }

/* 에이전트 테이블 */
.ar-table-wrap {
  overflow-x: auto;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  background: #fff;
}
.ar-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.ar-table thead tr {
  background: var(--gray-50);
  border-bottom: 1px solid var(--gray-200);
}
.ar-table th {
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray-500);
  white-space: nowrap;
}
.ar-table-group-row td {
  background: var(--gray-50);
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-600);
  letter-spacing: .04em;
  border-top: 1px solid var(--gray-200);
}
.ar-table-row td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--gray-100);
  vertical-align: top;
}
.ar-table-row:last-child td { border-bottom: none; }
.ar-table-row.ar-has-issue { background: #fffbeb; }

.ar-agent-name      { font-weight: 700; color: var(--gray-800); margin-bottom: 2px; }
.ar-agent-role-short { font-size: 11px; color: var(--gray-500); line-height: 1.4; }
.ar-agent-issue     { font-size: 10px; color: var(--orange-600); margin-top: 4px; font-weight: 500; }
.ar-service-tag     { font-size: 10px; color: var(--gray-500); background: var(--gray-100); border-radius: 4px; padding: 2px 7px; white-space: nowrap; }
.ar-zero            { color: var(--gray-300); }
.ar-td-name         { min-width: 200px; max-width: 280px; }
.ar-td-center       { text-align: center; }

/* 활용도 badge */
.ar-badge           { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.ar-badge-high      { background: var(--green-50);  color: var(--green-600); }
.ar-badge-medium    { background: var(--yellow-50); color: var(--yellow-600); }
.ar-badge-low       { background: var(--gray-100);  color: var(--gray-500); }
.ar-badge-unclear   { background: var(--orange-50); color: var(--orange-600); }

/* 활용 유형 badge */
.ar-type-badge      { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 500; white-space: nowrap; }
.ar-type-ep         { background: #eff6ff; color: var(--blue-600); }
.ar-type-rr         { background: #f0fdf4; color: var(--green-600); }
.ar-type-do         { background: var(--gray-100); color: var(--gray-500); }
.ar-type-uc         { background: var(--orange-50); color: var(--orange-600); }

/* 추천 badge */
.ar-rec-badge       { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.ar-rec-keep        { background: #f0fdf4; color: var(--green-600); }
.ar-rec-clarify     { background: var(--yellow-50); color: var(--yellow-600); }
.ar-rec-merge       { background: var(--blue-50); color: var(--blue-600); }
.ar-rec-rename      { background: var(--purple-50); color: var(--purple-500); }
.ar-rec-archive     { background: var(--gray-100); color: var(--gray-500); }
.ar-rec-promote     { background: #eff6ff; color: var(--blue-600); }

/* 미래 계획 에이전트 */
.ar-future-wrap {
  margin-top: 16px;
  background: var(--gray-50);
  border: 1px dashed var(--gray-300);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.ar-future-label { font-size: 11px; color: var(--gray-500); flex-shrink: 0; }
.ar-future-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.ar-future-chip  { font-size: 11px; color: var(--gray-500); background: #fff; border: 1px solid var(--gray-200); border-radius: 4px; padding: 2px 9px; }
.ar-future-chip strong { color: var(--gray-700); }

/* 분석 노트 (역할 공백·분화) */
.ar-notes-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.ar-note-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 14px 16px;
  border-left: 4px solid var(--gray-300);
}
.ar-note-gap     { border-left-color: var(--orange-500); }
.ar-note-overlap { border-left-color: var(--blue-500); }
.ar-note-type    { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gray-400); margin-bottom: 4px; }
.ar-note-gap .ar-note-type  { color: var(--orange-600); }
.ar-note-overlap .ar-note-type { color: var(--blue-600); }
.ar-note-title   { font-size: 13px; font-weight: 700; color: var(--gray-800); margin-bottom: 6px; }
.ar-note-desc    { font-size: 12px; color: var(--gray-600); line-height: 1.6; }

/* 다음 개선 액션 */
.ar-actions-list { display: flex; flex-direction: column; gap: 10px; }
.ar-action-item  {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 14px 16px;
}
.ar-action-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.ar-action-label  { font-size: 13px; font-weight: 700; color: var(--gray-800); }
.ar-action-desc   { font-size: 12px; color: var(--gray-600); line-height: 1.6; margin-bottom: 4px; }
.ar-action-owner  { font-size: 10px; color: var(--gray-400); }

/* 우선순위 badge */
.ar-pri-badge  { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.ar-pri-high   { background: var(--red-50);    color: var(--red-600); }
.ar-pri-med    { background: var(--yellow-50); color: var(--yellow-600); }
.ar-pri-low    { background: var(--gray-100);  color: var(--gray-500); }


.sn-empty-label {
  font-size: 11px;
  color: var(--gray-400);
  line-height: 1.6;
}

/* ── Org Legend ── */
.org-legend {
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 16px 20px;
  margin-top: 20px;
  background: var(--gray-50);
}

.org-legend-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--gray-400);
  margin-bottom: 10px;
}

.org-legend-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px 24px;
}

.org-legend-item {
  font-size: 11px;
  color: var(--gray-500);
  line-height: 1.5;
}

.org-legend-item strong {
  color: var(--gray-700);
  display: block;
  margin-bottom: 1px;
}

/* ── 운영 방식 설명 ── */
.ops-model {
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 24px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px 32px;
}

.ops-model-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: .07em;
  grid-column: 1 / -1;
  margin-bottom: 4px;
}

.ops-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 13px;
  color: var(--gray-700);
  line-height: 1.6;
}

.ops-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 6px;
  flex-shrink: 0;
}

.ops-dot-purple { background: var(--purple-500); }
.ops-dot-blue   { background: var(--blue-500); }
.ops-dot-green  { background: var(--green-500); }
.ops-dot-orange { background: var(--orange-500); }
.ops-dot-gray   { background: var(--gray-400); }

.ops-item strong { color: var(--gray-900); }

/* ── Service Domain Cards (하단 상세) ── */
.service-domain-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.service-domain-card {
  background: #fff;
  border: 1.5px solid var(--gray-200);
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.service-domain-card.status-active { border-left: 4px solid var(--green-500); }
.service-domain-card.status-planned { border-left: 4px solid var(--gray-300); }

.sdc-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.sdc-name { font-size: 14px; font-weight: 700; color: var(--gray-900); }
.sdc-phase { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
.sdc-context { font-size: 11px; color: var(--gray-500); line-height: 1.5; }
.sdc-agents { font-size: 11px; color: var(--gray-400); }

/* ══════════════════════════════════════
   Service Insight Sections
   ══════════════════════════════════════ */

.insight-badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
}
.insight-badge-confirmed     { background: var(--green-50);   color: var(--green-600);  border: 1px solid #bbf7d0; }
.insight-badge-assumed       { background: var(--yellow-50);  color: var(--yellow-600); border: 1px solid #fef08a; }
.insight-badge-review-needed { background: var(--orange-50);  color: var(--orange-600); border: 1px solid #fed7aa; }

.insight-container { margin-top: 20px; }

.insight-header {
  border: 1px solid var(--gray-200);
  border-radius: 8px 8px 0 0;
  background: var(--gray-50);
  padding: 12px 16px;
  border-bottom: none;
}

.insight-header-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 4px;
}

.insight-header-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--gray-400);
}

.insight-section {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-top: none;
  padding: 16px 20px;
}
.insight-section:last-child { border-radius: 0 0 8px 8px; }

.insight-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-800);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.insight-source-note {
  font-size: 11px;
  color: var(--gray-400);
  margin-bottom: 10px;
  font-style: italic;
}

/* Overview table */
.insight-table { width: 100%; border-collapse: collapse; }
.insight-table tr:not(:last-child) td { border-bottom: 1px solid var(--gray-100); }
.insight-table td { padding: 5px 8px; vertical-align: top; font-size: 12px; }
.insight-label { color: var(--gray-500); white-space: nowrap; width: 130px; font-weight: 500; }
.insight-value { color: var(--gray-800); line-height: 1.5; }

/* Role cards */
.insight-role-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
}
.insight-role-card {
  border: 1px solid var(--gray-100);
  border-radius: 6px;
  padding: 10px 14px;
  background: var(--gray-50);
}
.insight-role-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.insight-role-name { font-size: 13px; font-weight: 700; color: var(--gray-900); }
.insight-role-purpose { font-size: 11px; color: var(--gray-500); margin-bottom: 6px; }
.insight-role-tasks { padding-left: 16px; font-size: 12px; color: var(--gray-700); line-height: 1.8; }
.insight-review-note {
  font-size: 11px;
  color: var(--orange-600);
  margin-top: 6px;
  padding: 4px 8px;
  background: var(--orange-50);
  border-radius: 4px;
}

/* IA section */
.insight-ia-entry,
.insight-ia-utility {
  font-size: 12px;
  color: var(--gray-700);
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}
.insight-ia-gnb {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.insight-ia-menu {
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  padding: 10px 12px;
  background: var(--gray-50);
}
.insight-ia-menu-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.insight-ia-menu-num {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--blue-500);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.insight-ia-menu-name { font-size: 12px; font-weight: 700; color: var(--gray-900); flex: 1; }
.insight-ia-sub { padding-left: 14px; font-size: 11px; color: var(--gray-600); line-height: 1.7; }
.insight-ia-children { color: var(--gray-400); font-size: 10px; }
.insight-ia-note { font-size: 10px; color: var(--gray-400); margin-top: 6px; font-style: italic; }

/* Scenarios */
.insight-scenario {
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  padding: 12px 16px;
  margin-bottom: 10px;
  background: var(--gray-50);
}
.insight-scenario-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.insight-scenario-num {
  font-size: 11px;
  font-weight: 600;
  color: var(--blue-600);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.insight-scenario-title { font-size: 13px; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; line-height: 1.4; }
.insight-scenario-steps { padding-left: 16px; font-size: 12px; color: var(--gray-700); line-height: 1.8; }

/* Journey table */
.insight-journey-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.insight-journey-table th {
  text-align: left;
  padding: 6px 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray-500);
  border-bottom: 2px solid var(--gray-200);
}
.insight-journey-table td {
  padding: 7px 8px;
  vertical-align: top;
  line-height: 1.5;
  border-bottom: 1px solid var(--gray-100);
}
.insight-journey-step { font-weight: 600; color: var(--gray-800); white-space: nowrap; width: 100px; }

/* Features grid */
.insight-features-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.insight-feature-item {
  background: var(--gray-50);
  border: 1px solid var(--gray-100);
  border-radius: 6px;
  padding: 10px 12px;
}
.insight-feature-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-900);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.insight-feature-desc {
  font-size: 11px;
  color: var(--gray-500);
  line-height: 1.5;
}

/* Open Questions list */
.insight-oq-list { display: flex; flex-direction: column; gap: 8px; }
.insight-oq-item {
  border: 1px solid var(--gray-100);
  border-radius: 6px;
  padding: 10px 12px;
  background: var(--gray-50);
}
.insight-oq-item.insight-oq-high { border-left: 3px solid var(--orange-400); }
.insight-oq-item.insight-oq-mid  { border-left: 3px solid var(--yellow-400); }
.insight-oq-item.insight-oq-low  { border-left: 3px solid var(--gray-200); }
.insight-oq-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}
.insight-oq-id {
  font-size: 10px;
  font-weight: 700;
  color: var(--gray-400);
  font-family: monospace;
}
.insight-oq-topic {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-800);
  flex: 1;
}
.insight-oq-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 10px;
}
.insight-oq-badge-high { background: var(--orange-50); color: var(--orange-600); border: 1px solid #fed7aa; }
.insight-oq-badge-mid  { background: var(--yellow-50); color: var(--yellow-600); border: 1px solid #fef08a; }
.insight-oq-badge-low  { background: var(--gray-100);  color: var(--gray-500);  border: 1px solid var(--gray-200); }
.insight-oq-question {
  font-size: 12px;
  color: var(--gray-600);
  line-height: 1.5;
}

/* UX Direction */
.insight-ux-item { padding: 8px 0; border-bottom: 1px solid var(--gray-100); }
.insight-ux-item:last-child { border-bottom: none; }
.insight-ux-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--gray-800);
  margin-bottom: 3px;
}
.insight-ux-value { font-size: 12px; color: var(--gray-600); line-height: 1.6; }

/* Review items */
.insight-review-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--gray-100);
  font-size: 12px;
}
.insight-review-item:last-child { border-bottom: none; }
.insight-review-num {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--gray-200);
  color: var(--gray-600);
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.insight-review-q { flex: 1; color: var(--gray-700); line-height: 1.5; }

/* IA tree (메뉴 트리) */
.ia-tree { margin-top: 12px; }

.ia-tree-row { margin-bottom: 14px; }

.ia-tree-menu-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--gray-100);
  margin-bottom: 2px;
}

.ia-tree-num {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--blue-500);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.ia-tree-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-900);
  flex: 1;
}

.ia-tree-subs {
  list-style: none;
  padding: 0;
  margin: 0;
  padding-left: 28px;
  border-left: 2px solid var(--gray-200);
  margin-left: 9px;
}

.ia-tree-subs li {
  font-size: 12px;
  color: var(--gray-700);
  padding: 2px 0 2px 8px;
  line-height: 1.5;
}

.ia-tree-children { color: var(--gray-400); font-size: 11px; }

.ia-tree-note {
  font-size: 10px;
  color: var(--gray-400);
  padding-left: 37px;
  margin-top: 3px;
  font-style: italic;
}
.sdc-focus { font-size: 11px; color: var(--blue-600); font-weight: 500; }

/* ══════════════════════════════════════
   IA 문서 레이아웃 (.ia-doc)
   ══════════════════════════════════════ */

.ia-doc { display: flex; flex-direction: column; gap: 24px; }

/* 섹션 소제목 */
.ia-block-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--gray-200);
}

/* ── 1. 진입 및 공통 영역 ── */
.ia-entry-row { display: flex; gap: 12px; flex-wrap: wrap; }
.ia-entry-item {
  display: flex;
  align-items: baseline;
  gap: 6px;
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
}
.ia-entry-label { font-weight: 600; color: var(--gray-500); white-space: nowrap; }
.ia-entry-value { color: var(--gray-800); }

/* ── 2. 메뉴 구조 테이블 ── */
.ia-table-scroll { overflow-x: auto; border: 1px solid var(--gray-200); border-radius: 8px; }
.ia-menu-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ia-menu-table th {
  text-align: left;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: .04em;
  background: var(--gray-50);
  border-bottom: 1px solid var(--gray-200);
  white-space: nowrap;
}
.ia-menu-table td { padding: 7px 12px; border-bottom: 1px solid var(--gray-100); vertical-align: top; }
.ia-menu-table tr:last-child td { border-bottom: none; }
.ia-menu-table tr:hover td { background: var(--gray-50); }

.ia-td-1d {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-900);
  white-space: nowrap;
  vertical-align: top;
  border-right: 2px solid var(--gray-200);
  background: var(--gray-50);
  padding: 8px 14px 8px 12px;
}
.ia-1d-note { font-size: 10px; font-weight: 400; color: var(--gray-400); margin-top: 2px; white-space: normal; }
.ia-td-2d { font-size: 12px; font-weight: 600; color: var(--gray-800); min-width: 120px; }
.ia-item-inline-note { font-size: 10px; color: var(--blue-600); margin-top: 2px; }
.ia-td-sub { color: var(--gray-600); min-width: 130px; }
.ia-td-role { color: var(--gray-500); min-width: 120px; }
.ia-td-status { white-space: nowrap; }

.ia-sub-tag {
  display: inline-block;
  background: var(--gray-100);
  color: var(--gray-600);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 11px;
  margin: 1px 2px 1px 0;
}
.ia-sub-empty { color: var(--gray-300); }

/* IA 상태 칩 */
.ia-status-chip {
  display: inline-flex;
  align-items: center;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
}
.ia-chip-confirmed { background: var(--green-50);   color: var(--green-600); }
.ia-chip-assumed   { background: var(--gray-100);   color: var(--gray-500); }
.ia-chip-review    { background: var(--yellow-50);  color: var(--yellow-600); }

/* ── 3. IA 트리 ── */
.ia-tree-compact {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  overflow: hidden;
}
.ia-tc-col {
  border-right: 1px solid var(--gray-200);
  padding: 12px;
  min-width: 130px;
  flex: 1;
}
.ia-tc-col:last-child { border-right: none; }
.ia-tc-root {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-900);
  padding-bottom: 8px;
  margin-bottom: 6px;
  border-bottom: 2px solid var(--gray-200);
}
.ia-tc-d1 {
  font-size: 11px;
  color: var(--gray-700);
  padding: 3px 0 3px 10px;
  border-left: 2px solid var(--gray-200);
  margin: 2px 0;
}
.ia-tc-d2 {
  font-size: 10px;
  color: var(--gray-500);
  padding: 2px 0 2px 10px;
  margin: 1px 0;
  border-left: 2px solid var(--gray-100);
  margin-left: 8px;
}
.ia-tc-d3 {
  font-size: 10px;
  color: var(--gray-400);
  padding: 1px 0 1px 8px;
  border-left: 1px solid var(--gray-100);
  margin-left: 8px;
}

/* ── 4. 확인 필요 박스 ── */
.ia-review-box {
  background: var(--yellow-50);
  border: 1px solid var(--yellow-500);
  border-radius: 8px;
  padding: 14px 16px;
}
.ia-review-box-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-700);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 8px;
}
.ia-review-list {
  margin: 0;
  padding: 0 0 0 16px;
  font-size: 12px;
  color: var(--gray-600);
  line-height: 1.8;
}

/* ── DS Application Section ── */
.dsa-summary {
  font-size: 12px;
  color: var(--gray-600);
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 14px;
  line-height: 1.6;
}
.dsa-block-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 8px;
}
.dsa-badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
}
.dsa-badge-confirmed { background: var(--green-50);  color: var(--green-600);  border: 1px solid #bbf7d0; }
.dsa-badge-candidate { background: var(--yellow-50); color: var(--yellow-600); border: 1px solid #fef08a; }
.dsa-badge-gap       { background: var(--orange-50); color: var(--orange-600); border: 1px solid #fed7aa; }

.dsa-gap-list { display: flex; flex-direction: column; gap: 6px; }
.dsa-gap-item {
  padding: 8px 10px;
  border-radius: 6px;
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  border-left: 3px solid var(--gray-300);
}
.dsa-gap-item.dsa-gap-p1 { border-left-color: var(--orange-400); }
.dsa-gap-item.dsa-gap-p2 { border-left-color: var(--yellow-400); }
.dsa-gap-item.dsa-gap-p3 { border-left-color: var(--gray-300); }
.dsa-gap-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 3px;
}
.dsa-gap-id {
  font-size: 10px;
  font-weight: 700;
  color: var(--gray-400);
  font-family: monospace;
}
.dsa-gap-cat {
  font-size: 11px;
  color: var(--gray-500);
  background: var(--gray-100);
  padding: 1px 6px;
  border-radius: 4px;
}
.dsa-gap-priority {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: auto;
}
.dsa-p-p1 { background: var(--orange-50); color: var(--orange-600); border: 1px solid #fed7aa; }
.dsa-p-p2 { background: var(--yellow-50); color: var(--yellow-600); border: 1px solid #fef08a; }
.dsa-p-p3 { background: var(--gray-100);  color: var(--gray-500);  border: 1px solid var(--gray-200); }
.dsa-gap-item-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--gray-800);
  font-family: monospace;
  margin-bottom: 2px;
}
.dsa-gap-desc {
  font-size: 11px;
  color: var(--gray-500);
  line-height: 1.5;
}

.dsa-cv-list { display: flex; flex-direction: column; gap: 6px; }
.dsa-cv-item {
  padding: 8px 10px;
  border-radius: 6px;
  background: var(--yellow-50);
  border: 1px solid var(--yellow-200);
}
.dsa-cv-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 3px;
  flex-wrap: wrap;
}
.dsa-cv-item-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--gray-800);
  font-family: monospace;
}
.dsa-cv-screen {
  font-size: 11px;
  color: var(--gray-500);
  background: var(--gray-100);
  padding: 1px 6px;
  border-radius: 4px;
}
.dsa-cv-check {
  font-size: 11px;
  color: var(--yellow-700);
  line-height: 1.5;
}

/* ── Insight tab wrapper ── */
.insight-tabs-wrapper { margin-top: 20px; }
.insight-tabs-wrapper .tabs { margin-bottom: 0; border-radius: 0; }
.insight-tabs-wrapper .tab-panel.active .insight-container { margin-top: 0; }

/* ── 버카다 벤치마크 ── */
.bm-summary {
  background: var(--blue-50);
  border: 1px solid #bfdbfe;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bm-summary-desc {
  font-size: 12px;
  color: var(--gray-700);
  line-height: 1.6;
}
.bm-summary-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.bm-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
}
.bm-table-scroll {
  overflow-x: auto;
  margin-top: 10px;
}
.bm-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.bm-table thead th {
  background: var(--gray-50);
  border-bottom: 2px solid var(--gray-200);
  padding: 8px 10px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-500);
  white-space: nowrap;
}
.bm-table tbody tr {
  border-bottom: 1px solid var(--gray-100);
  transition: background 0.1s;
}
.bm-table tbody tr:hover { background: var(--gray-50); }
.bm-table tbody td { padding: 9px 10px; vertical-align: top; }
.bm-th-feature, .bm-td-feature {
  width: 22%;
  font-weight: 600;
  color: var(--gray-800);
}
.bm-th-spec, .bm-td-spec {
  width: 28%;
  color: var(--gray-600);
  line-height: 1.5;
}
.bm-th-decision, .bm-td-decision {
  width: 8%;
  text-align: center;
}
.bm-th-rationale, .bm-td-rationale {
  width: 42%;
  color: var(--gray-600);
  line-height: 1.5;
}
.bm-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.bm-adopt  { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
.bm-adapt  { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
.bm-defer  { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }
.bm-reject { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
.bm-cluster-note {
  font-size: 11px;
  font-weight: 400;
  color: var(--gray-500);
  margin-left: 8px;
}

/* ── IA 제안 ── */
.ia-summary {
  display: flex;
  gap: 20px;
  background: #f0f9ff;
  border: 1px solid #bae6fd;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.ia-summary-left { flex: 1; min-width: 200px; }
.ia-summary-title { font-size: 11px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.ia-summary-desc { font-size: 12px; color: var(--gray-700); line-height: 1.6; }
.ia-summary-premise { font-size: 11px; color: var(--gray-500); margin-top: 6px; }
.ia-summary-right { display: flex; align-items: flex-start; padding-top: 4px; }
.ia-summary-stat-row { display: flex; gap: 6px; flex-wrap: wrap; }
.ia-stat {
  font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: 10px;
}

/* IA 판단 배지 */
.ia-dec-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; text-transform: uppercase; }
.ia-dec-keep   { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
.ia-dec-add    { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
.ia-dec-adapt  { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
.ia-dec-defer  { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }
.ia-dec-reject { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
.ia-dec-hold   { background: #fdf4ff; color: #7e22ce; border: 1px solid #e9d5ff; }

/* IA 3단 컬럼 */
.ia-three-col {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 10px;
}
@media (max-width: 1200px) { .ia-three-col { grid-template-columns: 1fr; } }

.ia-tree-block {
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  overflow: hidden;
}
.ia-tree-header {
  font-size: 12px; font-weight: 700;
  padding: 8px 12px;
  color: #fff;
}
.ia-hdr-minimal     { background: #2563eb; }
.ia-hdr-recommended { background: #16a34a; }
.ia-hdr-advanced    { background: #7c3aed; }
.ia-tree-desc { font-size: 11px; color: var(--gray-600); padding: 8px 12px 4px; line-height: 1.5; border-bottom: 1px solid var(--gray-100); }
.ia-tree-menus { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.ia-tree-menu {
  border: 1px solid var(--gray-100);
  border-radius: 6px;
  padding: 7px 10px;
  background: var(--gray-50);
}
.ia-tree-menu-name {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; color: var(--gray-800);
  margin-bottom: 3px;
}
.ia-tree-num { font-size: 10px; color: var(--gray-400); font-family: monospace; width: 18px; flex-shrink: 0; }
.ia-menu-prio { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; margin-left: auto; }
.ia-p0 { background: #dbeafe; color: #1e40af; }
.ia-p1 { background: #dcfce7; color: #166534; }
.ia-p2 { background: #f3f4f6; color: #6b7280; }
.ia-hold { background: #fdf4ff; color: #7e22ce; }
.ia-reject { background: #fee2e2; color: #dc2626; }
.ia-tree-menu-note { font-size: 10px; color: var(--gray-500); margin-bottom: 4px; font-style: italic; }
.ia-tree-sub-list { display: flex; flex-direction: column; gap: 1px; }
.ia-tree-sub { font-size: 11px; color: var(--gray-500); padding: 1px 0 1px 14px; }

/* 고도화 IA 추가 항목 */
.ia-adv-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.ia-adv-item { border: 1px solid var(--gray-100); border-radius: 6px; padding: 7px 10px; background: var(--gray-50); }
.ia-adv-menu { font-size: 12px; font-weight: 700; color: var(--gray-800); margin-bottom: 3px; }
.ia-adv-cond { font-size: 10px; font-weight: 400; color: var(--gray-500); margin-left: 6px; }

/* 사양 우선순위 테이블 */
.ia-spec-group { margin-bottom: 16px; }
.ia-spec-group-hdr {
  font-size: 11px; font-weight: 700;
  padding: 6px 10px;
  border-radius: 6px 6px 0 0;
  display: flex; align-items: center; gap: 8px;
  color: #fff;
}
.ia-p0-hdr     { background: #1d4ed8; }
.ia-p1-hdr     { background: #16a34a; }
.ia-p2-hdr     { background: #6b7280; }
.ia-hold-hdr   { background: #7c3aed; }
.ia-reject-hdr { background: #dc2626; }
.ia-spec-count { font-size: 10px; font-weight: 400; opacity: .8; }
.ia-spec-table { width: 100%; border-collapse: collapse; }
.ia-spec-table tr { border-bottom: 1px solid var(--gray-100); }
.ia-spec-table tr:last-child { border-bottom: none; }
.ia-spec-table td { padding: 7px 10px; font-size: 12px; vertical-align: top; }
.ia-spec-td { font-weight: 600; color: var(--gray-800); width: 38%; }
.ia-spec-reason { color: var(--gray-500); }

/* 확인 질문 */
.ia-oq-list { display: flex; flex-direction: column; gap: 8px; }
.ia-oq-item { border: 1px solid var(--gray-100); border-radius: 6px; padding: 10px 12px; background: var(--gray-50); }
.ia-q-critical { border-left: 3px solid #dc2626; }
.ia-q-high     { border-left: 3px solid #f97316; }
.ia-q-medium   { border-left: 3px solid var(--gray-300); }
.ia-oq-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.ia-oq-id { font-size: 10px; font-weight: 700; color: var(--gray-400); font-family: monospace; }
.ia-oq-badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
.ia-q-badge-critical { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
.ia-q-badge-high     { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }
.ia-q-badge-medium   { background: var(--gray-100); color: var(--gray-500); border: 1px solid var(--gray-200); }
.ia-oq-question { font-size: 12px; color: var(--gray-700); line-height: 1.5; margin-bottom: 4px; }
.ia-oq-impact { font-size: 11px; color: var(--gray-500); }


/* standalone 전용 오버라이드 */
body { display: block; background: var(--gray-50); }
.standalone-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
.standalone-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px; padding-bottom: 20px;

}
.standalone-title { font-size: 22px; font-weight: 700; color: var(--gray-900); }
.standalone-sub { font-size: 13px; color: var(--gray-500); margin-top: 4px; }
.standalone-badge {
  display: inline-block; padding: 4px 10px; border-radius: 4px;
  background: #dbeafe; color: #1e40af; font-size: 12px; font-weight: 600;
}
.standalone-meta { font-size: 12px; color: var(--gray-400); margin-top: 8px; text-align: right; }

// ── 유틸 ──
function badge(status) {
  const cls_map = {
    active: 'active', standby: 'standby', planned: 'planned',
    blocked: 'blocked', deprecated: 'deprecated', pending: 'pending',
    ok: 'ok', unknown: 'unknown', fail: 'fail', 'not-started': 'planned',
    draft: 'draft', high: 'high', medium: 'medium', low: 'low',
    'service-candidate': 'standby', 'common-candidate': 'planned',
    'common-approved': 'active', 'review-needed': 'pending',
    'designer-review-needed': 'pending',
  };
  const cls   = cls_map[status] || 'unknown';
  const label = STATUS_LABEL[status] || status;
  return `<span class="badge badge-${cls}">${label}</span>`;
}

function insightBadge(status) {
  const map = {
    confirmed:       ['confirmed',      '확인됨'],
    assumed:         ['assumed',        '추정'],
    'review-needed': ['review-needed',  '검토 필요'],
  };
  const [cls, label] = map[status] || ['unknown', status];
  return `<span class="insight-badge insight-badge-${cls}">${label}</span>`;
}

function iaStatusChip(status) {
  const map = {
    confirmed:       ['ia-chip-confirmed', '확인됨'],
    assumed:         ['ia-chip-assumed',   '추정'],
    'review-needed': ['ia-chip-review',    '확인 필요'],
  };
  const [cls, label] = map[status] || ['ia-chip-review', '확인 필요'];
  return `<span class="ia-status-chip ${cls}">${label}</span>`;
}

function el(tag, cls, html) {
  return `<${tag} class="${cls}">${html}</${tag}>`;
}

// ── 내비게이션 ──
function initNav() {
  const allNavItems = document.querySelectorAll('.nav-item, .nav-sub-item');
  allNavItems.forEach(item => {
    item.addEventListener('click', () => {
      const target = item.dataset.section;
      allNavItems.forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      item.classList.add('active');
      document.getElementById(`section-${target}`)?.classList.add('active');
      document.querySelector('.breadcrumb strong').textContent = item.querySelector('.nav-label').textContent;
    });
  });

  document.querySelectorAll('.nav-domain-toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
      const domain = toggle.dataset.domain;
      const items = document.querySelector(`.nav-domain-items[data-domain="${domain}"]`);
      toggle.classList.toggle('collapsed');
      items?.classList.toggle('collapsed');
    });
  });
}

// ── 탭 ──
function initTabs() {
  document.querySelectorAll('.tabs').forEach(tabsEl => {
    tabsEl.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const group = tab.dataset.group;
        const target = tab.dataset.target;
        tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll(`.tab-panel[data-group="${group}"]`).forEach(p => p.classList.remove('active'));
        document.querySelector(`.tab-panel[data-group="${group}"][data-panel="${target}"]`)?.classList.add('active');
      });
    });
  });
}

  const displayName = AGENT_NAME_MAP[a.name] || a.name;

  return `

        <div>
          <div class="agent-card-name">${displayName}</div>

      <div class="agent-card-role">${a.role}</div>

          <span class="agent-card-activation-label">활성화 조건</span>

function initAgentDetailTabs() {
  const tabsEl = document.querySelector('.agent-detail-tabs');
  if (!tabsEl) return;
  tabsEl.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const group = tab.dataset.group;
      const target = tab.dataset.target;
      tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll(`.tab-panel[data-group="${group}"]`).forEach(p => p.classList.remove('active'));
      document.querySelector(`.tab-panel[data-group="${group}"][data-panel="${target}"]`)?.classList.add('active');
      const headerH    = document.querySelector('.main-header')?.offsetHeight ?? 0;
      const tabsAbsTop = tabsEl.getBoundingClientRect().top + window.scrollY;
      window.scrollTo({ top: Math.max(0, tabsAbsTop - headerH), behavior: 'instant' });
    });
  });
}

function openImageModal(src, title) {
  let modal = document.getElementById('sn-image-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'sn-image-modal';
    modal.className = 'sn-modal-overlay';
    modal.innerHTML = `
      <div class="sn-modal-box">
        <div class="sn-modal-header">
          <span class="sn-modal-title"></span>
          <button class="sn-modal-close" aria-label="닫기">✕</button>
        </div>
        <div class="sn-modal-body">
          <img class="sn-modal-img" src="" alt="">
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.querySelector('.sn-modal-close').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });
  }
  modal.querySelector('.sn-modal-title').textContent = title;
  modal.querySelector('.sn-modal-img').src = src;
  modal.querySelector('.sn-modal-img').alt = title;
  modal.classList.add('open');
}
